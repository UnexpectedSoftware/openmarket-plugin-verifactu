name: CI

# Docs-only changes (docs/**, **/*.md, .agents/**, .cursor/**, .cursorignore, LICENSE) skip CI.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.agents/**'
      - '.cursor/**'
      - '.cursorignore'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.agents/**'
      - '.cursor/**'
      - '.cursorignore'
      - 'LICENSE'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: verifactu-zip
          path: dist/*.zip
